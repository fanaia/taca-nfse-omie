name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Validate manifests
        run: node -e "for (const f of ['central.app.json','backend/central.manifest.json','frontend/central.ui.json','oon.deploy.json']) JSON.parse(require('fs').readFileSync(f,'utf8'));"
      - name: Backend install
        working-directory: backend
        run: npm ci
      - name: Backend syntax
        working-directory: backend
        run: find src test -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Backend tests
        working-directory: backend
        run: npm test
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Core pin guard
        run: |
          node -e "const b=require('./backend/package.json'),f=require('./frontend/package.json'); if(b.dependencies['@oondemand/oon-core-back']!=='0.3.74'||f.dependencies['@oondemand/oon-core-front']!=='0.3.74') process.exit(1)"
