name: publish-dev

on:
  push:
    branches: [main]

jobs:
  request:
    permissions:
      contents: read
      id-token: write
    uses: oondemand/oon-publish/.github/workflows/request-dev.yml@main

  smoke-public-api:
    needs: request
    runs-on: ubuntu-latest
    steps:
      - name: Validar Swagger e OpenAPI públicos no host da Central
        env:
          API_BASE: https://taca-nfse-omie-dev.central.oondemand.online/api
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            docs_status="$(curl --silent --show-error --location \
              --dump-header "$RUNNER_TEMP/swagger.headers" \
              --output "$RUNNER_TEMP/swagger.html" \
              --write-out '%{http_code}' \
              "$API_BASE/taca/v1/docs" || true)"
            init_status="$(curl --silent --show-error --location \
              --output "$RUNNER_TEMP/docs-init.js" \
              --write-out '%{http_code}' \
              "$API_BASE/taca/v1/docs-init.js" || true)"
            openapi_status="$(curl --silent --show-error --location \
              --output "$RUNNER_TEMP/openapi.json" \
              --write-out '%{http_code}' \
              "$API_BASE/taca/v1/openapi.json" || true)"

            version_ready=false
            if [[ "$docs_status" == "200" && "$init_status" == "200" && "$openapi_status" == "200" ]] \
              && grep -q 'swagger-ui-bundle.js' "$RUNNER_TEMP/swagger.html" \
              && grep -q '/api/taca/v1/docs-init.js' "$RUNNER_TEMP/swagger.html" \
              && grep -q 'SwaggerUIBundle' "$RUNNER_TEMP/docs-init.js" \
              && grep -q 'preauthorizeApiKey("bearerAuth", token)' "$RUNNER_TEMP/docs-init.js" \
              && grep -q '/api/auth/autenticar' "$RUNNER_TEMP/docs-init.js" \
              && grep -qi '^content-security-policy:.*script-src' "$RUNNER_TEMP/swagger.headers"; then
              version_ready=true
            fi

            if [[ "$version_ready" == "true" ]]; then
              node - "$RUNNER_TEMP/openapi.json" <<'NODE'
          const fs = require('node:fs');
          const spec = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (spec.openapi !== '3.0.3') throw new Error('OpenAPI inesperado.');
          if (!spec.paths?.['/api/auth/autenticar']?.post) throw new Error('Autenticação ausente no OpenAPI.');
          if (!spec.paths?.['/api/taca/v1/orders']?.post) throw new Error('Endpoint de pedidos ausente no OpenAPI.');
          NODE

              if grep -qi '^content-security-policy:.*script-src[^;]*unsafe-inline' "$RUNNER_TEMP/swagger.headers"; then
                echo "CSP do Swagger não deve liberar unsafe-inline para scripts." >&2
                exit 1
              fi

              if grep -qE '<script[[:space:]]*>' "$RUNNER_TEMP/swagger.html"; then
                echo "Swagger ainda contém script inline executável." >&2
                exit 1
              fi

              echo "Swagger público disponível em $API_BASE/taca/v1/docs"
              echo "Bootstrap CSP-safe e bearerAuth automático disponíveis em $API_BASE/taca/v1/docs-init.js"
              echo "OpenAPI público disponível em $API_BASE/taca/v1/openapi.json"
              exit 0
            fi

            echo "Tentativa $attempt/60: docs=$docs_status init=$init_status openapi=$openapi_status; aguardando versão nova"
            sleep 5
          done

          echo "Swagger/OpenAPI da versão esperada não ficaram disponíveis no host público da Central." >&2
          exit 1
