name: refresh-lockfiles

on:
  push:
    branches: [agent/core-0.3.75-rbac]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/core-0.3.75-rbac
      - name: Update public API RBAC guidance
        shell: python
        run: |
          from pathlib import Path

          pt = Path("docs/api/README.pt-BR.md")
          text = pt.read_text(encoding="utf-8")
          text = text.replace(
              "A Plataforma deve usar um usuário dedicado da Central com a role `integracao-taca`, criado no OonCore e sem uso humano compartilhado. O token/sessão segue o mecanismo padrão de autenticação do OonCore 0.3.74.",
              "A Plataforma deve usar um usuário dedicado da Central com o perfil RBAC `Canal de Vendas (plataforma)` (`canal-vendas`), criado no OonCore e sem uso humano compartilhado. O token/sessão segue o mecanismo padrão de autenticação do OonCore 0.3.75.",
          )
          text = text.replace(
              "- não atribuir `admin`/`desenvolvedor` ao usuário da Plataforma;",
              "- não atribuir os perfis `Administrador` ou `Operador` ao usuário da Plataforma;",
          )
          text = text.replace(
              "- usuário autenticado sem role permitida retorna `403` pelo Core.",
              "- usuário autenticado sem a permissão RBAC exigida retorna `403` pelo Core.",
          )
          pt.write_text(text, encoding="utf-8")

          en = Path("docs/api/README.en.md")
          text = en.read_text(encoding="utf-8")
          text = text.replace(
              "The Platform must use a dedicated OonCore user with role `integracao-taca`. Do not reuse a human account. Token/session handling follows the standard OonCore 0.3.74 authentication flow.",
              "The Platform must use a dedicated OonCore user with the `Canal de Vendas (plataforma)` RBAC profile (`canal-vendas`). Do not reuse a human account. Token/session handling follows the standard OonCore 0.3.75 authentication flow.",
          )
          text = text.replace(
              "- do not grant `admin` or `desenvolvedor` to the Platform account;",
              "- do not grant the `Administrador` or `Operador` profiles to the Platform account;",
          )
          text = text.replace(
              "- an authenticated user without an allowed role is rejected with `403` by the Core.",
              "- an authenticated user without the required RBAC permission is rejected with `403` by the Core.",
          )
          en.write_text(text, encoding="utf-8")
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api/README.pt-BR.md docs/api/README.en.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: document Canal de Vendas RBAC profile"
          git push
